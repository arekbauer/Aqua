name: Android CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit tests, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Run unit tests, lint, debug build, and coverage report
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug jacocoTestReport
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: aqua-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-quality-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: ignore
